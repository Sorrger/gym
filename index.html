<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Gym</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default" id="sbs">
  <script>
    // iOS reads the status bar style when the app starts: dark theme chosen in the app → translucent bar over our dark background
    try { var l = JSON.parse(localStorage.getItem('look') || '{}'), d = l.mode === 'dark' || ((!l.mode || l.mode === 'system') && matchMedia('(prefers-color-scheme: dark)').matches)
      if (d) { document.getElementById('sbs').setAttribute('content', 'black-translucent'); document.documentElement.style.background = '#000' } } catch (e) {}
  </script>
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-title" content="Gym">
  <meta name="format-detection" content="telephone=no">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" href="icon-192.png">
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
